---
datasources:
  default:
    password: "${DB_PASSWORD}"
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
graphql:
  graphiql:
    enabled: false
liquibase:
  datasources:
    default:
      contexts: "prod"
logger:
  levels:
    com.anasdidi.portal: "${LOG_LEVEL}"
micronaut:
  router:
    static-resources:
      web:
        paths: "file:/home/app/dist/"
  security:
    token:
      cookie:
        cookie-secure: "${COOKIE_SECURE}"
      generator:
        access-token:
          expiration: "${ACCESS_TOKEN_EXPIRY_SECS}"
      jwt:
        signatures:
          secret:
            generator:
              secret: "${JWT_SECRET}"
